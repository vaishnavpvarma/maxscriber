[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maxscriber"
version = "3.0.0"
description = "A pure Python ecosystem for high-throughput clinical bioinformatics data extraction and validation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Developer", email = "developer@example.com" }
]
dependencies = [
    "typer>=0.9.0",
    "sqlalchemy>=2.0.0",
    "polars>=0.19.0",
    "pandas>=2.0.0",
    "rpy2>=3.5.11"
]

[project.scripts]
maxscriber = "maxscriber.cli:app"

[project.optional-dependencies]
ml = [
    "torch>=2.0.0",
    "torchvision",
    "torchaudio",
    "transformers>=4.30.0",
    "accelerate>=0.20.0",
    "chromadb>=0.4.0"
]
