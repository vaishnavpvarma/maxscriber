name: MaxHospitals_Dengue
version: "1.0"
description: "SRL/Agilus Diagnostics - CBC, LFT, KFT, Dengue Serology"
metadata:
  MAX_id: '(?i)(?:max\s*id|lab\s*id|patient\s*id|uhid|reg\s*no|sample\s*id)[:\s]+([a-zA-Z0-9_\-\.]+)'
  Patient Name: '(?i)(?:patient\s*name|name)[:\s]+([a-zA-Z\s\.]+)'
  Age/Gender: '(?i)(?:age\s*/\s*gender|age\s*&\s*gender)[:\s]+([^\n\r]+)'
  Age: '(?i)\b(\d{1,3})\s*(?:years?|yrs?|y)?\b'
  Gender: '(?i)\b(male|female|m|f)\b'
  SIN No.: '(?i)(?:sin\s*no|sin|sample\s*id)[:\s]+([a-zA-Z0-9_\-\.]+)'
  Centre: '(?i)(?:centre|center|location|lab\s*name|branch)[:\s]+([^\n\r]+)'
  Collection Date: '(?i)(?:collection\s*date|collected\s*on|sample\s*collected)[:\s]+([0-9]{1,2}[\/\-\.][0-9]{1,2}[\/\-\.][0-9]{2,4})'
tests:
  - Haemoglobin
  - Packed Cell,Volume
  - Total Leukocyte Count(TLC)
  - RBC
  - MCV
  - MCH
  - MCHC
  - Platelet
  - MPV
  - RDW
  - Neutrophils
  - Lymphocytes
  - Monocytes
  - Eosinophils
  - Basophils
  - Absolute Neutrophil Count
  - Absolute Lymphocyte Count
  - Absolute Monocyte Count
  - Absolute Eosinophil Count
  - Absolute Basophil Count
  - Total Protein
  - Albumin
  - Globulin
  - A.G.
  - Bilirubin (Total)
  - Bilirubin (Direct)
  - Bilirubin (Indirect)
  - Transaminase (AST)
  - Transaminase (ALT)
  - Alkaline Phosphatase
  - GGTP (Gamma GT), Serum
  - Dengue NS1 Antigen
  - Dengue IgG
  - Dengue IgM
  - Urea
  - BUN
  - Creatinine
  - BUN_Creatinine_Ratio
  - Uric_Acid
  - eGFR
